[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nuluno-engine-community"
version = "0.13.0a2"
description = "Apache-2.0 portable execution and bounded learning core with a complete S01 starter"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
media = ["Pillow>=10.4,<12", "imageio-ffmpeg>=0.6,<0.7"]

[project.scripts]
nuluno-engine-community = "nuluno_engine_community.growth_loop.cli:main"

[tool.setuptools]
packages = ["nuluno_engine_community", "nuluno_engine_community.growth_loop"]
package-dir = {"nuluno_engine_community" = "community_namespace", "nuluno_engine_community.growth_loop" = "skills/growth-meta-ig-loop/runtime/growth_loop"}
